name: Mavericks sandbox diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: sandbox-diagnostic-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: mavergreen-nodejs
          path: dist
          run-id: 40089756198
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: nodejs-vm-tests
          path: dist
          run-id: 40089756198
          github-token: ${{ github.token }}
      - uses: Mavergreen/mavericks-vm@v1
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          run: sh tests/vm/diagnose-sandbox.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sandbox-diagnostic
          path: vm-results/
